<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0908">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Assistant">
<meta name="description" content="Şəxsi AI köməkçi: gündəlik cədvəl, büdcə, sağlamlıq, kalori, aktivlik, şəxsi inkişaf və tıxac analitikası — Azərbaycan dilində.">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>My Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wght@0,500;0,600;1,400;1,500&family=Noto+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-shaped app shell; onyx + champagne gold, hairline gold rules, serif display.
   Luxury: dark-first, monochrome gold accents, generous spacing, no loud color. */
:root{
  --paper:#0f0e0c;
  --card:#181613;
  --card-2:#1f1c18;
  --ink:#f2ebdc;
  --ink-soft:#a39b8a;
  --line:#2e2a23;
  --gold:#c9a961;
  --gold-hi:#e8d29a;
  --gold-lo:#8c7238;
  --head:#0a0908;
  --head-fg:#f2ebdc;
  --bubble-me:linear-gradient(135deg,#d9bd78,#a8873f);
  --bubble-me-fg:#14110c;
  --bubble-ai:#181613;
  --backdrop:#070706;
  --display:"Noto Serif Display", "Didot", Georgia, serif;
  --body:"Noto Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --c1:#c9a961; --c2:#c9a961; --c3:#c9a961; --c4:#c9a961; --c5:#c9a961; --c6:#c9a961;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --paper:#f6f1e7; --card:#fffdf8; --card-2:#fbf6ec; --ink:#1a1712; --ink-soft:#6f6555; --line:#e3d8c3;
  --gold:#9c7a32; --gold-hi:#c9a961; --gold-lo:#7a5e22; --head:#14120e; --head-fg:#f2ebdc;
  --bubble-me:linear-gradient(135deg,#1f1b15,#2d271e); --bubble-me-fg:#f2ebdc; --bubble-ai:#fffdf8; --backdrop:#e9e1d1;
  --c1:#9c7a32; --c2:#9c7a32; --c3:#9c7a32; --c4:#9c7a32; --c5:#9c7a32; --c6:#9c7a32; color-scheme:light}}
:root[data-theme="light"]{
  --paper:#f6f1e7; --card:#fffdf8; --card-2:#fbf6ec; --ink:#1a1712; --ink-soft:#6f6555; --line:#e3d8c3;
  --gold:#9c7a32; --gold-hi:#c9a961; --gold-lo:#7a5e22; --head:#14120e; --head-fg:#f2ebdc;
  --bubble-me:linear-gradient(135deg,#1f1b15,#2d271e); --bubble-me-fg:#f2ebdc; --bubble-ai:#fffdf8; --backdrop:#e9e1d1;
  --c1:#9c7a32; --c2:#9c7a32; --c3:#9c7a32; --c4:#9c7a32; --c5:#9c7a32; --c6:#9c7a32; color-scheme:light}

html,body{height:100%}
body{background:var(--backdrop);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;display:flex;justify-content:center}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:1px solid var(--gold);outline-offset:3px}

.app{position:relative;width:100%;max-width:440px;height:100%;background:var(--paper);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:600px){
  body{padding-block:24px;align-items:center}
  .app{height:min(860px,100%);border-radius:34px;border:1px solid var(--gold-lo);
    box-shadow:0 0 0 6px var(--head),0 0 0 7px var(--gold-lo),0 40px 80px -30px rgba(0,0,0,.6)}
}

/* Header */
.top{background:var(--head);color:var(--head-fg);
  padding:16px max(18px, env(safe-area-inset-right,0px)) 16px max(18px, env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:12px;flex:none}
.crest{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid #c9a961;display:grid;place-items:center;
  font-family:var(--display);font-style:italic;font-size:21px;color:#e8d29a;background:radial-gradient(circle at 30% 30%,#2a241a,#0a0908)}
.back{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid #c9a961;background:transparent;display:grid;place-items:center;color:#e8d29a}
.top-text{min-width:0;flex:1}
.eyebrow{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:#c9a961}
.top h1{font-family:var(--display);font-weight:500;font-size:23px;margin:1px 0 0;line-height:1.15;letter-spacing:.02em;text-wrap:balance;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clear{border:1px solid #8c7238;background:transparent;color:#e8d29a;border-radius:20px;padding:6px 13px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.rule{height:1px;flex:none;background:linear-gradient(90deg,transparent,#c9a961 20%,#e8d29a 50%,#c9a961 80%,transparent)}

.screen{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* Home */
.home{padding:28px max(20px, env(safe-area-inset-right,0px)) 28px max(20px, env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:24px}
.greet{text-align:center;display:flex;flex-direction:column;align-items:center}
.greet .date{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:500}
.greet h2{font-family:var(--display);font-weight:500;font-style:italic;font-size:34px;margin:8px 0 6px;line-height:1.1;text-wrap:balance}
.greet p{margin:0;color:var(--ink-soft);font-size:14px}
.orn{display:flex;align-items:center;gap:10px;color:var(--gold);margin-top:14px;width:60%}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn::after{background:linear-gradient(90deg,var(--gold),transparent)}
.orn i{width:6px;height:6px;transform:rotate(45deg);border:1px solid var(--gold)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{background:linear-gradient(160deg,var(--card-2),var(--card));border:1px solid var(--line);border-radius:4px;padding:18px 14px 16px;text-align:left;
  display:flex;flex-direction:column;gap:12px;min-height:158px;position:relative;transition:border-color .25s, transform .2s}
.cat::after{content:"";position:absolute;inset:5px;border:1px solid transparent;border-radius:2px;pointer-events:none;transition:border-color .25s}
.cat:hover{border-color:var(--gold-lo)}
.cat:hover::after{border-color:color-mix(in srgb,var(--gold) 35%,transparent)}
.cat:active{transform:scale(.985)}
.cat .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--gold);border:1px solid var(--gold-lo);background:transparent}
.cat .ic svg{width:19px;height:19px}
.cat b{font-family:var(--display);font-weight:500;font-size:17.5px;line-height:1.2;letter-spacing:.01em}
.cat span{font-size:12px;color:var(--ink-soft);line-height:1.45}
.note{border-top:1px solid var(--line);padding-top:16px;font-size:12.5px;color:var(--ink-soft);text-align:center}
.note strong{color:var(--gold);font-weight:500;letter-spacing:.04em}

/* Chat */
.chat{display:flex;flex-direction:column;height:100%}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:20px max(16px, env(safe-area-inset-right,0px)) 10px max(16px, env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.intro{border:1px solid var(--line);border-left:none;border-right:none;padding:14px 4px;text-align:center}
.intro .k{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;font-weight:500}
.intro p{margin:8px 0 0;color:var(--ink-soft);font-size:13.5px}
.b{max-width:86%;padding:11px 15px;border-radius:18px;font-size:14.5px;overflow-wrap:anywhere}
.b.me{align-self:flex-end;background:var(--bubble-me);color:var(--bubble-me-fg);border-bottom-right-radius:4px;white-space:pre-wrap}
.b.ai{align-self:flex-start;background:var(--bubble-ai);border:1px solid var(--line);border-bottom-left-radius:4px}
.b.ai p{margin:0 0 8px}.b.ai p:last-child{margin-bottom:0}
.b.ai ul,.b.ai ol{margin:4px 0 8px;padding-left:20px}
.b.ai li{margin:2px 0}.b.ai li::marker{color:var(--gold)}
.b.ai strong{color:var(--gold-hi);font-weight:600}
:root[data-theme="light"] .b.ai strong{color:var(--gold-lo)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .b.ai strong{color:var(--gold-lo)}}
.b.ai h4{font-family:var(--display);font-weight:500;font-size:16.5px;margin:8px 0 4px;color:var(--gold)}
.b.ai code{background:var(--card-2);border:1px solid var(--line);padding:1px 5px;border-radius:4px;font-size:13px}
.b.err{align-self:center;background:transparent;border:1px dashed var(--gold-lo);color:var(--ink-soft);font-size:13px;text-align:center}
.thinking{display:inline-flex;gap:5px;align-items:center;color:var(--ink-soft);font-style:italic}
.thinking i{width:5px;height:5px;transform:rotate(45deg);background:var(--gold);animation:p 1.4s infinite ease-in-out}
.thinking i:nth-child(2){animation-delay:.18s}.thinking i:nth-child(3){animation-delay:.36s}
@keyframes p{0%,80%,100%{opacity:.2}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.thinking i{animation:none;opacity:.7}.cat,.cat::after{transition:none}}

.quick{flex:none;display:flex;gap:8px;overflow-x:auto;padding:8px max(16px, env(safe-area-inset-right,0px)) 8px max(16px, env(safe-area-inset-left,0px));scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.q{flex:none;border:1px solid var(--gold-lo);background:transparent;color:var(--gold);border-radius:20px;padding:7px 14px;font-size:12.5px;letter-spacing:.03em;white-space:nowrap;transition:background .2s,color .2s}
.q:hover{background:var(--gold);color:var(--paper)}
.q:disabled{opacity:.4;cursor:default}

.compose{flex:none;display:flex;gap:10px;align-items:flex-end;border-top:1px solid var(--line);background:var(--card);
  padding:12px max(14px, env(safe-area-inset-right,0px)) 12px max(14px, env(safe-area-inset-left,0px))}
.compose textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:22px;background:var(--paper);color:var(--ink);font:inherit;font-size:15px;padding:10px 16px;max-height:120px;line-height:1.4}
.compose textarea::placeholder{color:var(--ink-soft);font-style:italic}
.compose textarea:focus{border-color:var(--gold-lo);outline:none}
.send{width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(135deg,#e8d29a,#a8873f);color:#14110c;display:grid;place-items:center;flex:none}
.send.stop{background:var(--card-2);color:var(--gold);border:1px solid var(--gold)}
.send:disabled{opacity:.45;cursor:default}

/* Tab bar */
.tabs{flex:none;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--gold-lo);background:var(--head);
  padding:8px max(4px, env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(4px, env(safe-area-inset-left,0px))}
.tab{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:#7d7566;font-size:9.5px;letter-spacing:.04em;white-space:nowrap;overflow:hidden}
.tab svg{width:20px;height:20px}
.tab[aria-current="true"]{color:#e8d29a}
.tab[aria-current="true"] span{font-weight:600}

/* Səhər ritualı */
.ritual{border:1px solid var(--gold-lo);border-radius:6px;background:linear-gradient(160deg,var(--card-2),var(--card));padding:16px;display:flex;flex-direction:column;gap:12px}
.r-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.r-k{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.r-t{font-family:var(--display);font-size:17px;margin-top:2px}
.r-clock{font-family:var(--display);font-size:28px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1}
.r-bar{height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.r-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi));transition:width .9s linear}
.r-now{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--ink-soft)}
.r-now b{color:var(--ink);font-weight:600;font-size:14.5px;font-variant-numeric:tabular-nums}
.r-list{counter-reset:mv;margin:0;padding:0;list-style:none;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.r-list li{display:flex;justify-content:space-between;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-soft);counter-increment:mv}
.r-list li span::before{content:counter(mv) ". ";color:var(--gold-lo)}
.r-list li em{font-style:normal;font-variant-numeric:tabular-nums;white-space:nowrap}
.r-list li.cur{color:var(--ink)}.r-list li.cur span{color:var(--gold);font-weight:600}
.r-list li.done{opacity:.45;text-decoration:line-through}
.r-actions{display:flex;gap:8px}
.r-btn{flex:1;border:1px solid var(--gold-lo);background:transparent;color:var(--gold);border-radius:22px;padding:9px;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase}
.r-btn.primary{background:linear-gradient(135deg,#e8d29a,#a8873f);color:#14110c;border-color:transparent;font-weight:600}
.r-music{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.r-play{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--gold);background:transparent;color:var(--gold);display:grid;place-items:center}
.r-mt{flex:1;min-width:0;display:flex;flex-direction:column}
.r-mt b{font-family:var(--display);font-weight:500;font-size:15px}
.r-mt span{font-size:11.5px;color:var(--ink-soft)}
.r-eq{display:flex;gap:3px;align-items:flex-end;height:18px}
.r-eq i{width:3px;height:4px;background:var(--gold);border-radius:1px}
.r-eq.on i{animation:eq .9s infinite ease-in-out}
.r-eq.on i:nth-child(2){animation-delay:.2s}.r-eq.on i:nth-child(3){animation-delay:.4s}.r-eq.on i:nth-child(4){animation-delay:.1s}
@keyframes eq{0%,100%{height:4px}50%{height:18px}}
@media (prefers-reduced-motion:reduce){.r-eq.on i{animation:none;height:12px}.r-bar i{transition:none}}

/* Kalori paneli */
.kcal{border:1px solid var(--gold-lo);border-radius:6px;background:linear-gradient(160deg,var(--card-2),var(--card));padding:16px;display:flex;flex-direction:column;gap:12px}
.k-ic{color:var(--gold);flex:none}
.k-drop{display:grid;place-items:center;min-height:150px;border:1px dashed var(--gold-lo);border-radius:6px;cursor:pointer;overflow:hidden;text-align:center;padding:10px;transition:border-color .2s,background .2s}
.k-drop:hover,.k-drop.over{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 6%,transparent)}
.k-drop img{max-width:100%;max-height:240px;border-radius:4px;object-fit:contain}
.k-drop span{display:flex;flex-direction:column;gap:4px}
.k-drop b{font-family:var(--display);font-weight:500;font-size:16px;color:var(--gold)}
.k-drop small{font-size:12px;color:var(--ink-soft)}
.k-note{border:1px solid var(--line);border-radius:22px;background:var(--paper);color:var(--ink);font:inherit;font-size:14px;padding:9px 15px;min-width:0}
.k-note:focus{outline:none;border-color:var(--gold-lo)}
.k-note::placeholder{color:var(--ink-soft);font-style:italic}
.k-out{display:flex;flex-direction:column;gap:12px}
.k-out:empty{display:none}
.k-total{display:flex;align-items:baseline;justify-content:center;gap:8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0}
.k-total span{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-soft)}
.k-total b{font-family:var(--display);font-weight:500;font-size:44px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.k-total em{font-style:italic;color:var(--ink-soft)}
.k-macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.k-macros div{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:4px;padding:8px 4px}
.k-macros b{font-variant-numeric:tabular-nums;font-weight:600}
.k-macros span{font-size:11px;letter-spacing:.06em;color:var(--ink-soft)}
.k-items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.k-items li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line)}
.k-items li div{display:flex;flex-direction:column;min-width:0}
.k-items li b{font-weight:500}
.k-items li small{font-size:12px;color:var(--ink-soft)}
.k-items li span{color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.k-note-out{margin:0;font-size:13.5px}
.k-disc{margin:0;font-size:11.5px;color:var(--ink-soft);font-style:italic}
.k-warn{margin:0;font-size:13px;color:var(--ink-soft);border:1px dashed var(--gold-lo);border-radius:4px;padding:10px;text-align:center}

.cat:last-child:nth-child(odd){grid-column:1/-1;min-height:0}
/* Gündəlik balans */
.s-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.s-grid div{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:4px;padding:10px 4px}
.s-grid span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.s-grid b{font-family:var(--display);font-weight:500;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.s-grid em{font-style:italic;font-size:11px;color:var(--ink-soft)}
.s-grid .s-net{border-color:var(--gold-lo)}
.s-grid .s-net b{color:var(--gold)}
.s-eq{text-align:center;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.s-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.s-list li{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px}
.s-list li span{min-width:0;overflow-wrap:anywhere}
.s-list time{color:var(--ink-soft);font-variant-numeric:tabular-nums;font-size:12px}
.s-list b{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.s-list b.in{color:var(--ink)}
.s-list b.out{color:var(--gold)}
.s-list .s-empty{display:block;color:var(--ink-soft);font-style:italic;text-align:center}
.s-del{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink-soft);line-height:1;font-size:15px;padding:0}
.s-del:hover{border-color:var(--gold);color:var(--gold)}
/* Aktivlik */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg-b{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);border-radius:4px;background:transparent;padding:10px 2px;font-size:11.5px;color:var(--ink-soft)}
.seg-b svg{width:22px;height:22px}
.seg-b[aria-selected="true"]{border-color:var(--gold);color:var(--gold);background:color-mix(in srgb,var(--gold) 8%,transparent)}
.a-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.a-f{display:flex;flex-direction:column;gap:4px;min-width:0}
.a-f>span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.a-f .k-note{width:100%;border-radius:8px}
.a-wide{grid-column:1/-1}
select.k-note{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.a-prev{display:flex;align-items:baseline;justify-content:center;gap:8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0}
.a-prev b{font-family:var(--display);font-weight:500;font-size:38px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.a-prev em{font-style:italic;color:var(--ink-soft)}
.k-man{border-top:1px solid var(--line);padding-top:10px}
.k-man summary{cursor:pointer;color:var(--gold);font-size:13px;letter-spacing:.04em}
.k-man[open]{display:flex;flex-direction:column;gap:10px}
.k-man[open] .a-grid{margin-top:4px}

/* Profil */
.p-chip{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:1px solid var(--gold-lo);border-radius:24px;background:transparent;padding:9px 16px;text-align:left;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.p-chip em{font-style:italic;color:var(--gold);font-size:12px;white-space:nowrap}
.p-chip.p-cta{flex-direction:column;align-items:flex-start;gap:2px;border-radius:6px;padding:12px 16px;background:color-mix(in srgb,var(--gold) 7%,transparent)}
.p-chip.p-cta b{font-family:var(--display);font-weight:500;font-size:16px;color:var(--gold)}
.p-chip.p-cta span{font-size:12px;color:var(--ink-soft)}
.seg-2{grid-template-columns:1fr 1fr}
.seg-2 .seg-b{font-size:13.5px;padding:10px}
.seg-b[aria-checked="true"]{border-color:var(--gold);color:var(--gold);background:color-mix(in srgb,var(--gold) 8%,transparent)}
input[type="date"].k-note{min-height:40px}
.k-err{margin:0;color:var(--gold);font-size:13px;text-align:center}
#pForm .s-grid em{font-size:10.5px}

.sc-add{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.sc-add .k-note{min-width:0;border-radius:8px}
.sc-add .r-btn{flex:none;width:44px;height:40px;padding:0;font-size:20px;line-height:1}
.s-list li.sc-row{grid-template-columns:auto 1fr auto}
.reset{border-color:var(--line)}

.crest svg{width:40px;height:40px;display:block}
.crest{font-size:0;border:none!important;background:none!important;border-radius:0!important}
.hero-logo{width:92px;height:92px;margin-bottom:12px}
.hero-logo svg{width:100%;height:100%;display:block}
[hidden]{display:none!important}
</style>

</head>

function shrink(blob){ return new Promise((res,rej)=>{ const img=new Image(); const u=URL.createObjectURL(blob);
  img.onload=()=>{ const m=1280, k=Math.min(1, m/Math.max(img.width,img.height)); const c=document.createElement('canvas');
    c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(u); res({media_type:'image/jpeg', data:c.toDataURL('image/jpeg',.85).split(',')[1]}); };
  img.onerror=()=>{ URL.revokeObjectURL(u); rej({code:'image_rejected',message:'bad image'}); }; img.src=u; }); }
async function apiSample(input, opts={}){
  let images=[];
  if(opts.images){ const arr = opts.images instanceof Blob ? [opts.images] : Array.from(opts.images); images = await Promise.all(arr.slice(0,2).map(shrink)); }
  let r;
  try{ r = await fetch('/api/ask',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({input,images}),signal:opts.signal}); }
  catch(e){ throw {code: e && e.name==='AbortError' ? 'cancelled' : 'upstream_error', message:String(e)}; }
  let data={}; try{ data=await r.json(); }catch(e){}
  if(!r.ok) throw {code: r.status===429?'rate_limited': r.status===413?'prompt_too_large':'upstream_error', message:data.error||String(r.status)};
  const text=String(data.text||''); if(!text.trim()) throw {code:'empty_completion',message:'empty'};
  if(opts.onText) try{ opts.onText({text, delta:text}); }catch(e){}
  return {text, truncated: !!data.truncated, modelTierApplied:'default'};
}
apiSample.json = async (input, opts={})=>{
  const {text} = await apiSample(input+'\n\nCavabı YALNIZ JSON kimi qaytar.', opts);
  const tries=[text, (text.match(/```(?:json)?\s*([\s\S]*?)```/)||[])[1], (()=>{ const a=text.search(/[\[{]/), b=Math.max(text.lastIndexOf('}'),text.lastIndexOf(']')); return a>=0&&b>a?text.slice(a,b+1):null; })()];
  for(const t of tries){ if(!t) continue; try{ return JSON.parse(t); }catch(e){} }
  throw {code:'invalid_json', message:'no json', text};
};
apiSample.limits = async ()=>({maxPromptBytes:262144, images:{maxCount:2, maxInputBytes:20e6, mediaTypes:['image/jpeg','image/png','image/webp','image/gif']}});

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function md(src){
  const lines = esc(src).split('\n'); let out=''; let list=null;
  const inline = t => t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g,'$1<em>$2</em>').replace(/`([^`]+)`/g,'<code>$1</code>');
  const close = () => { if(list){ out += `</${list}>`; list=null; } };
  for(const raw of lines){
    const l = raw.trim();
    let m;
    if(!l){ close(); continue; }
    if(m = l.match(/^#{1,4}\s+(.*)/)){ close(); out += `<h4>${inline(m[1])}</h4>`; continue; }
    if(m = l.match(/^[-*•]\s+(.*)/)){ if(list!=='ul'){close(); out+='<ul>'; list='ul';} out += `<li>${inline(m[1])}</li>`; continue; }
    if(m = l.match(/^\d+[.)]\s+(.*)/)){ if(list!=='ol'){close(); out+='<ol>'; list='ol';} out += `<li>${inline(m[1])}</li>`; continue; }
    close(); out += `<p>${inline(l)}</p>`;
  }
  close(); return out;
}

function setBusy(on){

const ERR = {
  not_granted:'AI-dan istifadəyə icazə verilmədi. Səhifəni yenidən açıb icazə verə bilərsiniz.',
  sampling_disabled:'AI bu hesab üçün əlçatan deyil.',
  rate_limited:'Çox sayda sorğu göndərildi. Bir az gözləyib yenidən cəhd edin.',
  session_expired:'Sessiyanın vaxtı bitib. Yenidən daxil olun.',
  refused:'Bu suala cavab verilə bilmədi. Sualı başqa cür yazın.',
  prompt_too_large:'Mesaj çox uzundur. Daha qısa yazın və ya "Təmizlə" düyməsini basın.',
  empty_completion:'Cavab alınmadı. Sualı sadələşdirib yenidən göndərin.'
};

async function ask(id, text){
  const c = byId[id];
  const s = sampleFn !== undefined ? sampleFn : await samplePromise;
  history[id].push({role:'user', content:text}); save();
  if(current===id){ addBubble('me', text); $('clear').hidden=false; }
  if(!s){ disabled=true; if(current===id) addBubble('err','AI köməkçi hazırda əlçatan deyil. İnternet bağlantısını yoxlayın.'); return; }
  const bubble = current===id ? addBubble('ai','') : null;
  if(bubble) bubble.innerHTML = '<span class="thinking"><i></i><i></i><i></i> Düşünürəm…</span>';
  busy = new AbortController(); setBusy(true);
  const ctxLog = (id==='saglamliq'||id==='aktivlik') ? '\n\nİSTİFADƏÇİNİN BUGÜNKÜ GÜNDƏLİYİ:\n'+logText() : id==='cedvel' ? '\n\n'+schedText() : '';
  const turns = [{role:'user', content: c.prompt + profileText() + ctxLog + '\n\n(Bu təlimatları qəbul et və aşağıdakı söhbətə Azərbaycan dilində cavab ver.)'}, ...history[id].slice(-12)];
  // merge consecutive same-role turns is handled by platform; ensure first after rules is fine
  try{
    const {text:answer, truncated} = await s(turns, {cache:false, signal:busy.signal,
      onText:({text})=>{ if(bubble){ bubble.innerHTML = md(text); const m=$('msgs'); if(m) m.scrollTop=m.scrollHeight; } }});
    const final = answer + (truncated ? '\n\n*(Cavab yarımçıq kəsildi.)*' : '');
    history[id].push({role:'assistant', content: final}); save();
    if(bubble) bubble.innerHTML = md(final);
  }catch(e){
    const partial = e && e.text;
    if(partial){ history[id].push({role:'assistant', content: partial}); save(); if(bubble) bubble.innerHTML = md(partial); }
    else if(bubble) bubble.remove();
    if(e && e.code !== 'cancelled'){
      if(['not_granted','sampling_disabled','not_declared','capability_disabled'].includes(e.code)) disabled = true;
      if(current===id) addBubble('err', ERR[e.code] || 'Əlaqə xətası baş verdi. Yenidən cəhd edin.');
    }
  }finally{ busy=null; setBusy(false); }
}

const TOTAL = MOVES.reduce((a,m)=>a+m[1],0);
let rit = {timer:null, elapsed:0, running:false};
const mmss = t => `${String(Math.floor(t/60)).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')}`;

function ritualCard(){
  const d = document.createElement('div'); d.className='ritual'; d.id='ritual';
  d.innerHTML = `
    <div class="r-head"><div><div class="r-k">Səhər ritualı</div><div class="r-t">Budilnikdən dərhal sonra · 15 dəqiqə</div></div>

    <div class="r-actions">

      <div class="r-eq" id="mEq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </div>`;
  setTimeout(()=>{
    $('rStart').onclick = ()=> rit.running ? pauseRitual() : startRitual();
    $('rReset').onclick = ()=>{ stopRitual(); rit.elapsed=0; paintRitual(); };
    $('mPlay').onclick = ()=> music.on ? stopMusic() : startMusic();
    paintRitual();
  });
  return d;
}
function currentMove(){ let t=rit.elapsed; for(let i=0;i<MOVES.length;i++){ if(t<MOVES[i][1]) return [i, MOVES[i][1]-t]; t-=MOVES[i][1]; } return [MOVES.length, 0]; }
function paintRitual(){
  if(!$('ritual')) return;
  const left = Math.max(0, TOTAL - rit.elapsed);
  $('rClock').textContent = mmss(left);
  $('rBar').style.width = (rit.elapsed/TOTAL*100)+'%';
  const [i, rem] = currentMove();
  document.querySelectorAll('#rList li').forEach(li=>{ const k=+li.dataset.i; li.className = k<i?'done':k===i&&(rit.running||rit.elapsed>0)?'cur':''; });
  if(i>=MOVES.length){ $('rNow').innerHTML='<b>Əla! İsitmə tamamlandı.</b><span>Bir stəkan su için və gününüzə başlayın.</span>'; }
  else if(rit.running || rit.elapsed>0){ $('rNow').innerHTML=`<b>${MOVES[i][0]} · ${mmss(rem)}</b><span>${MOVES[i][2]}</span>`; }
  $('rStart').textContent = rit.running ? 'Fasilə' : (rit.elapsed>0 && rit.elapsed<TOTAL ? 'Davam et' : 'Başla');
}
function beep(){ try{ const c=ensureCtx(); const o=c.createOscillator(), g=c.createGain(); o.type='sine'; o.frequency.value=880; g.gain.setValueAtTime(.0001,c.currentTime); g.gain.exponentialRampToValueAtTime(.25,c.currentTime+.02); g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.4); o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+.45);}catch(e){} }
function startRitual(){
  if(rit.elapsed>=TOTAL) rit.elapsed=0;
  rit.running=true; ensureCtx();
  if(!music.on) startMusic();
  let last = currentMove()[0];
  rit.timer = setInterval(()=>{
    rit.elapsed++;
    const now=currentMove()[0]; if(now!==last){ beep(); last=now; }
    if(rit.elapsed>=TOTAL){ stopRitual(); stopMusic(); beep(); }
    paintRitual();
  },1000);
  paintRitual();
}
function pauseRitual(){ rit.running=false; clearInterval(rit.timer); rit.timer=null; paintRitual(); }

/* Web Audio ilə yaradılan orijinal məşq musiqisi (Am – F – C – G, 120 BPM) */
let actx=null; const music={on:false, timer:null, next:0, step:0, master:null};
function ensureCtx(){ if(!actx){ const C=window.AudioContext||window.webkitAudioContext; actx=new C(); } if(actx.state==='suspended') actx.resume(); return actx; }
const BPM=120, S16=60/BPM/4;
const CHORDS=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]]; // Am F C G
const BASS=[45,41,48,43];
const hz = n => 440*Math.pow(2,(n-69)/12);
function voice(type,freq,t,dur,vol,dest,attack=.005){
  const o=actx.createOscillator(), g=actx.createGain(); o.type=type; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+attack); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(dest); o.start(t); o.stop(t+dur+.05);
}
function kick(t,d){ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(42,t+.12);
  g.gain.setValueAtTime(.9,t); g.gain.exponentialRampToValueAtTime(.0001,t+.3); o.connect(g).connect(d); o.start(t); o.stop(t+.32); }
let noiseBuf=null;
function hat(t,d,vol){ if(!noiseBuf){ noiseBuf=actx.createBuffer(1,actx.sampleRate*.1,actx.sampleRate); const a=noiseBuf.getChannelData(0); for(let i=0;i<a.length;i++) a[i]=Math.random()*2-1; }
  const s=actx.createBufferSource(); s.buffer=noiseBuf; const f=actx.createBiquadFilter(); f.type='highpass'; f.frequency.value=7000;
  const g=actx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+.05); s.connect(f).connect(g).connect(d); s.start(t); s.stop(t+.06); }
function scheduleStep(st,t){
  const d=music.master, bar=Math.floor(st/16)%4, s=st%16, ch=CHORDS[bar];
  if(s%4===0) kick(t,d);
  if(s%4===2) hat(t,d,.18); else if(s%2===1) hat(t,d,.06);
  if(s===4||s===12) hat(t,d,.12);
  if(s%2===0) voice('triangle',hz(BASS[bar]+(s%8===6?12:0)),t,S16*1.8,.32,d);
  if(s===0) ch.forEach(n=>voice('sawtooth',hz(n),t,S16*15,.035,d,.25));
  const arp=[0,1,2,1,0,2,1,2]; if(s%2===0) voice('square',hz(ch[arp[(s/2)%8]]+12),t,S16*1.2,.045,d);
}
function startMusic(){
  try{ ensureCtx(); }catch(e){ return; }
  music.master=actx.createGain(); music.master.gain.value=.5;
  const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=5200; music.master.connect(lp).connect(actx.destination); music.out=lp;
  music.on=true; music.step=0; music.next=actx.currentTime+.08;
  music.timer=setInterval(()=>{ while(music.next < actx.currentTime+.2){ scheduleStep(music.step,music.next); music.next+=S16; music.step++; } },50);
  paintMusic();
}
function stopMusic(){ if(!music.on) return; music.on=false; clearInterval(music.timer);
  try{ const g=music.master.gain; g.setValueAtTime(g.value,actx.currentTime); g.linearRampToValueAtTime(0,actx.currentTime+.3); const o=music.out; setTimeout(()=>{ try{o.disconnect()}catch(e){} },400);}catch(e){}
  paintMusic(); }
function paintMusic(){ const b=$('mPlay'); if(!b) return; b.setAttribute('aria-label', music.on?'Musiqini dayandır':'Musiqini çal');
  b.innerHTML = music.on ? '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>' : '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  $('mEq').classList.toggle('on', music.on); }

const num = v => { const n=Math.round(Number(v)); return isFinite(n)?n:0; };
async function runKcal(){
  if(!kcalFile) return;
  if(kcalCtl){ kcalCtl.abort(); return; }
  const sm = sampleFn !== undefined ? sampleFn : await samplePromise;
  const out=$('kOut');
  if(!sm){ out.innerHTML='<p class="k-warn">AI bu baxışda əlçatan deyil.</p>'; return; }
  const note=$('kNote').value.trim();
  const prompt=`Şəkildə yemək və/və ya içki var. Hər birini müəyyən et, porsiya ölçüsünü təxmin et və kalorini hesabla.
${note?`İstifadəçinin qeydi: "${note}"\n`:''}Bütün mətnlər Azərbaycan dilində olsun. Yalnız bu formatda JSON qaytar, başqa heç nə yazma:
{"yemek_var": true, "items":[{"ad":"Plov","miqdar":"təxm. 300 q","kkal":520,"zulal":14,"yag":18,"karbohidrat":75}], "cem_kkal":520, "qeyd":"1-2 cümləlik qısa, neytral qidalanma qeydi"}
Zülal, yağ, karbohidrat qramla. Şəkildə yemək və ya içki yoxdursa {"yemek_var": false, "items": [], "cem_kkal": 0, "qeyd": "səbəb"} qaytar.`;
  kcalCtl=new AbortController(); $('kGo').textContent='Dayandır';
  out.innerHTML='<span class="thinking"><i></i><i></i><i></i> Şəkil təhlil olunur…</span>';
  try{
    const r = await sm.json(prompt,{images:kcalFile, signal:kcalCtl.signal});
    if(!r || r.yemek_var===false || !Array.isArray(r.items) || !r.items.length){
      out.innerHTML=`<p class="k-warn">${esc(String(r&&r.qeyd||'Şəkildə yemək və ya içki tanınmadı. Başqa şəkil yoxlayın.'))}</p>`; return;

    const total = num(r.cem_kkal) || items.reduce((a,i)=>a+i.kkal,0);
    const Z=items.reduce((a,i)=>a+i.z,0), Y=items.reduce((a,i)=>a+i.y,0), K=items.reduce((a,i)=>a+i.k,0);
    out.innerHTML=`

      ${r.qeyd?`<p class="k-note-out">${esc(String(r.qeyd))}</p>`:''}
      <button class="r-btn primary" id="kAdd" type="button">Gündəliyə əlavə et · ${total} kkal</button>
      <p class="k-disc">Rəqəmlər şəkil əsasında təxminidir; real dəyər resept və porsiyaya görə dəyişə bilər.</p>`;
    const nm = items.map(i=>i.ad).join(', ');
    $('kAdd').onclick = ()=>{ day().food.push({ad:nm, kkal:total, vaxt:nowHM()}); saveLog(); const b=$('kAdd'); b.disabled=true; b.textContent='Gündəliyə əlavə olundu ✓'; };
  }catch(e){
    const code=e&&e.code;
    if(code==='cancelled') out.innerHTML='';
    else out.innerHTML=`<p class="k-warn">${
      code==='images_unavailable'?'Şəkil təhlili bu baxışda əlçatan deyil.':
      code==='image_rejected'?'Bu şəkil qəbul olunmadı. JPEG və ya PNG formatında başqa şəkil seçin.':
      code==='invalid_json'?'Nəticə oxunmadı. Yenidən "Kalorini hesabla" düyməsinə toxunun.':
      ERR[code]||'Əlaqə xətası baş verdi. Yenidən cəhd edin.'}</p>`;
  }finally{ kcalCtl=null; const b=$('kGo'); if(b) b.textContent='Kalorini hesabla'; }
}

  try{ localStorage.setItem('inv-log', JSON.stringify(LOG)); }catch(e){} paintSummaries(); }

let PROFILE={ad:'',dogum:'',cins:'',boy:'',ceki:'',meqsed:''};
try{ const p=JSON.parse(localStorage.getItem('inv-profile')||'null'); if(p) PROFILE=Object.assign(PROFILE,p); }catch(e){}

const GOALS={'':'Seçilməyib',arıqlamaq:'Arıqlamaq',saxlamaq:'Çəkini saxlamaq',ezele:'Əzələ yığmaq',saglam:'Ümumi sağlamlıq'};
function ageOf(d){ if(!d) return null; const b=new Date(d+'T00:00:00'); if(isNaN(b)) return null; const n=new Date();
  let a=n.getFullYear()-b.getFullYear(); if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate())) a--; return (a>=5&&a<=110)?a:null; }
function stats(p){
  const a=ageOf(p.dogum), h=+p.boy, w=+p.ceki;
  const okH=h>=100&&h<=230, okW=w>=30&&w<=250;
  const bmi = okH&&okW ? w/((h/100)**2) : null;
  const cat = bmi==null?'' : bmi<18.5?'Normadan aşağı' : bmi<25?'Normal' : bmi<30?'Normadan yuxarı' : 'Yüksək';
  const bmr = (okH&&okW&&a&&p.cins) ? Math.round(10*w+6.25*h-5*a+(p.cins==='kisi'?5:-161)) : null;
  return {a,bmi,cat,bmr};
}
const fmt1 = x => x.toFixed(1).replace('.',',');
function profileReady(){ return !!(PROFILE.dogum && PROFILE.boy && PROFILE.ceki); }

  if(PROFILE.cins) parts.push('Cins: '+(PROFILE.cins==='kisi'?'kişi':'qadın'));
  if(PROFILE.boy) parts.push('Boy: '+PROFILE.boy+' sm');
  if(PROFILE.ceki) parts.push('Çəki: '+PROFILE.ceki+' kq');
  if(st.bmi) parts.push('BKİ: '+fmt1(st.bmi)+' ('+st.cat+')');
  if(st.bmr) parts.push('Bazal metabolizm (Mifflin-St Jeor): təxm. '+st.bmr+' kkal/gün');
  if(PROFILE.meqsed) parts.push('Məqsəd: '+GOALS[PROFILE.meqsed]);

}

  $('rsAsk').onclick=()=>{ $('rsAsk').hidden=true; $('rsConfirm').hidden=false; };
  $('rsNo').onclick=()=>{ $('rsAsk').hidden=false; $('rsConfirm').hidden=true; };
  $('rsYes').onclick=resetAll;
  let cins=PROFILE.cins;
  $('pAd').value=PROFILE.ad; $('pDog').value=PROFILE.dogum; $('pBoy').value=PROFILE.boy; $('pCeki').value=PROFILE.ceki; $('pMeq').value=PROFILE.meqsed;
  $('pDog').max=todayKey();
  const read=()=>({ad:$('pAd').value.trim(),dogum:$('pDog').value,cins,boy:$('pBoy').value,ceki:$('pCeki').value,meqsed:$('pMeq').value});
  const paint=()=>{ document.querySelectorAll('[data-cins]').forEach(b=>b.setAttribute('aria-checked', b.dataset.cins===cins));
    const st=stats(read());
    $('pStats').innerHTML=`<div><span>Yaş</span><b>${st.a??'—'}</b><em>il</em></div>
      <div><span>BKİ</span><b>${st.bmi?fmt1(st.bmi):'—'}</b><em>${st.cat||'kq/m²'}</em></div>
      <div class="s-net"><span>Bazal</span><b>${st.bmr??'—'}</b><em>kkal/gün</em></div>`; };
  document.querySelectorAll('[data-cins]').forEach(b=>b.onclick=()=>{ cins=b.dataset.cins; paint(); });
  ['pDog','pBoy','pCeki'].forEach(i=>$(i).addEventListener('input',paint));
  paint();
  if($('pSkip')) $('pSkip').onclick=()=>{ try{localStorage.setItem('inv-prof-skip','1')}catch(e){} go('home'); };
  $('pForm').addEventListener('submit',e=>{ e.preventDefault();
    const p=read(), st=stats(p), err=$('pErr');
    const msg = !st.a ? 'Doğum tarixini düzgün daxil edin.' : !(+p.boy>=100&&+p.boy<=230) ? 'Boyu 100–230 sm aralığında yazın.' : !(+p.ceki>=30&&+p.ceki<=250) ? 'Çəkini 30–250 kq aralığında yazın.' : '';
    if(msg){ err.textContent=msg; err.hidden=false; return; }
    PROFILE=p; WEIGHT=+p.ceki;
    try{ localStorage.setItem('inv-profile',JSON.stringify(p)); localStorage.setItem('inv-weight',String(WEIGHT)); }catch(e){}
    go('home'); });
}
const ACTS = {
  yeris:{ad:'Yürüş', ic:'<circle cx="13" cy="4.5" r="1.8"/><path d="M10 21l2-6 2.5 2v4M9 11l2-3h2.5l1.5 3.5 2.5 1"/>',
    lv:[['Yavaş · 3 km/s',2.8],['Orta · 5 km/s',3.5],['Sürətli · 6,5 km/s',5.0]]},
  qacis:{ad:'Qaçış', ic:ICONS.aktivlik,
    lv:[['Yüngül · 8 km/s',8.3],['Orta · 10 km/s',9.8],['Sürətli · 12 km/s',11.8]]},
  uzme:{ad:'Üzmə', ic:'<circle cx="16" cy="6" r="1.8"/><path d="M5 12l4-3 3 2 3-2"/><path d="M2 17c2 0 2-1.5 4-1.5S8 17 10 17s2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5"/>',
    lv:[['Sakit',5.8],['Orta',8.3],['Sürətli',9.8]]},
  velo:{ad:'Velosiped', ic:'<circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-7h5l3 7M10 9l2.5 7M13 6h3"/>',
    lv:[['Yavaş · <16 km/s',4.0],['Orta · 16–19 km/s',6.8],['Sürətli · 19–22 km/s',8.0]]}
};
let actType='yeris';
function actCard(){
  const d=document.createElement('div'); d.className='kcal'; d.id='act';
  d.innerHTML=`<div class="r-head"><div><div class="r-k">Aktivlik paneli</div><div class="r-t">Fəaliyyəti qeyd edin, kalori avtomatik hesablanır</div></div></div>
    <div class="seg" role="tablist">${Object.entries(ACTS).map(([k,a])=>`<button type="button" class="seg-b" data-act="${k}" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${a.ic}</svg><span>${a.ad}</span></button>`).join('')}</div>
    <div class="a-grid">
      <label class="a-f a-wide"><span>Temp</span><select class="k-note" id="aLv"></select></label>
      <label class="a-f"><span>Müddət (dəq.)</span><input class="k-note" id="aMin" type="number" min="1" max="600" inputmode="numeric" value="30"></label>
      <label class="a-f"><span>Vaxt</span><input class="k-note" id="aTime" type="time"></label>
      <label class="a-f"><span>Çəkiniz (kq)</span><input class="k-note" id="aW" type="number" min="30" max="250" inputmode="decimal" value="${WEIGHT}"></label>
    </div>
    <div class="a-prev"><b id="aK">0</b><em>kkal yandırılacaq</em></div>
    <button class="r-btn primary" id="aAdd" type="button">Aktivliyi əlavə et</button>
    <p class="k-disc">Hesablama: MET × çəki (kq) × saat. Nəticə təxminidir; nəbz, yaş və relyefə görə dəyişə bilər.</p>`;
  setTimeout(()=>{
    $('aTime').value=nowHM();
    d.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{ actType=b.dataset.act; fillLv(); });
    ['aLv','aMin','aW'].forEach(id=>$(id).addEventListener('input',calcAct));
    $('aW').addEventListener('change',()=>{ const w=+$('aW').value; if(w>=30&&w<=250){ WEIGHT=w; PROFILE.ceki=String(w); try{localStorage.setItem('inv-weight',String(w)); localStorage.setItem('inv-profile',JSON.stringify(PROFILE));}catch(e){} } });
    $('aAdd').onclick=()=>{ const k=calcAct(); const m=num($('aMin').value); if(k<=0||m<=0){ $('aMin').focus(); return; }
      const a=ACTS[actType], lv=a.lv[+$('aLv').value];
      day().act.push({ad:`${a.ad} (${lv[0].split(' · ')[0].toLowerCase()})`, deq:m, kkal:k, vaxt:$('aTime').value||nowHM()}); saveLog();
      const b=$('aAdd'); b.textContent='Əlavə olundu ✓'; setTimeout(()=>{ if($('aAdd')) $('aAdd').textContent='Aktivliyi əlavə et'; },1500); };
    fillLv();
  });
  return d;
}
function fillLv(){
  const a=ACTS[actType]; document.querySelectorAll('[data-act]').forEach(b=>b.setAttribute('aria-selected', b.dataset.act===actType));
  $('aLv').innerHTML=a.lv.map((l,i)=>`<option value="${i}" ${i===1?'selected':''}>${esc(l[0])} · MET ${String(l[1]).replace('.',',')}</option>`).join('');
  calcAct();
}
function calcAct(){
  const el=$('aK'); if(!el) return 0;
  const met=ACTS[actType].lv[+$('aLv').value||0][1], m=Math.max(0,+$('aMin').value||0), w=(+$('aW').value>=30?+$('aW').value:WEIGHT);
  const k=Math.round(met*w*m/60); el.textContent=k; return k;
}

/* ---------- Mənim cədvəlim: hər kəs öz cədvəlini qurur ---------- */
let SCHED=[]; try{ SCHED=JSON.parse(localStorage.getItem('inv-sched')||'[]')||[]; }catch(e){ SCHED=[]; }
const saveSched=()=>{ SCHED.sort((a,b)=>a.vaxt.localeCompare(b.vaxt)); try{ localStorage.setItem('inv-sched',JSON.stringify(SCHED)); }catch(e){} paintSched(); };
function schedText(){ return SCHED.length ? 'İSTİFADƏÇİNİN ÖZ CƏDVƏLİ ("Mənim cədvəlim"):\n'+SCHED.map(x=>`${x.vaxt} — ${x.is}`).join('\n') : 'İstifadəçi hələ öz cədvəlini qurmayıb.'; }
function schedCard(){
  const d=document.createElement('div'); d.className='kcal'; d.id='sched';
  d.innerHTML=`<div class="r-head"><div><div class="r-k">Mənim cədvəlim</div><div class="r-t">Gününüzü özünüz qurun</div></div></div>
    <ul class="s-list" id="scList"></ul>
    <div class="sc-add">
      <input class="k-note" id="scTime" type="time" aria-label="Vaxt">
      <input class="k-note" id="scText" type="text" maxlength="80" placeholder="məs. Budilnik, iş, idman" aria-label="Fəaliyyət">
      <button class="r-btn primary" id="scAdd" type="button" aria-label="Əlavə et">+</button>
    </div>
    <p class="k-disc">Cədvəl yalnız bu telefonda saxlanılır. AI köməkçi ona baxaraq məsləhət verir.</p>`;
  setTimeout(()=>{
    const add=()=>{ const t=$('scTime').value, x=$('scText').value.trim(); if(!t){ $('scTime').focus(); return; } if(!x){ $('scText').focus(); return; }
      SCHED.push({vaxt:t,is:x}); $('scText').value=''; saveSched(); $('scText').focus(); };
    $('scAdd').onclick=add; $('scText').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); add(); } });
    paintSched();
  });
  return d;
}
function paintSched(){ const ul=$('scList'); if(!ul) return;
  ul.innerHTML = SCHED.length ? SCHED.map((x,i)=>`<li class="sc-row"><time>${esc(x.vaxt)}</time><span>${esc(x.is)}</span><button type="button" class="s-del" data-sdel="${i}" aria-label="Sil">×</button></li>`).join('')
    : '<li class="s-empty">Cədvəl boşdur. Vaxtı və fəaliyyəti yazıb + düyməsinə toxunun.</li>'; }
document.addEventListener('click',e=>{ const b=e.target.closest('[data-sdel]'); if(!b) return; SCHED.splice(+b.dataset.sdel,1); saveSched(); });

/* ---------- Hamısını sıfırla ---------- */
const KEYS=['kompas-history','kompas-tab','inv-log','inv-weight','inv-profile','inv-prof-skip','inv-sched'];
function resetAll(){
  KEYS.forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
  CATS.forEach(c=>history[c.id]=[]); LOG={}; SCHED=[]; WEIGHT=70;
  PROFILE={ad:'',dogum:'',cins:'',boy:'',ceki:'',meqsed:''};
  go('profil');
}

function go(id){
  if(busy) busy.abort();
  stopRitual(); stopMusic(); if(kcalCtl) kcalCtl.abort();
  current = id; renderTabs();
  if(id==='home') renderHome(); else if(id==='profil') renderProfile(); else renderChat(id);
  $('screen').scrollTop = 0;
  try{ localStorage.setItem('kompas-tab', id); }catch(e){}
}

document.addEventListener('click', e=>{
  const g = e.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; }
  const q = e.target.closest('[data-q]'); if(q && !busy){ const c=byId[current]; ask(current, c.quick[+q.dataset.q][1]); return; }
});
$('back').onclick = ()=>go('home');
$('profBtn').onclick = ()=>go('profil');
$('clear').onclick = ()=>{ if(current==='home') return; history[current]=[]; save(); renderChat(current); };

let start='home';
try{ const t=localStorage.getItem('kompas-tab'); if(t && (t==='home'||byId[t])) start=t; }catch(e){}
const h = location.hash.slice(1); if(byId[h]) start=h;
let profSkip=false; try{ profSkip = localStorage.getItem('inv-prof-skip')==='1'; }catch(e){}
if(!profileReady() && !profSkip) start='profil';
go(start);
</script>
